<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <title>Create/Edit Company Profile</title>
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
</head>
<body>
  <div class="container">
    <h2 th:text="${company.id} != null ? 'Edit Your Profile' : 'Create Company Profile'"></h2>
    <form th:action="@{/company/profile}" th:object="${company}" method="post">
      
      <!-- if editing, include the existing ID so JPA will UPDATE -->
      <input type="hidden" th:if="${company.id != null}" th:field="*{id}" />

      <div class="form-group">
        <label for="name">Company Name</label>
        <input type="text"
               th:field="*{name}"
               class="form-control"
               id="name"
               placeholder="Enter company name"
               required>
      </div>
      <div class="form-group">
        <label for="location">Location</label>
        <input type="text"
               th:field="*{location}"
               class="form-control"
               id="location"
               placeholder="City, Country"
               required>
      </div>
      <button type="submit" class="btn btn-primary">Save Profile</button>
      <!-- after save we redirect to /company/dashboard -->
      <a th:href="@{/company/dashboard}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</body>
</html>
