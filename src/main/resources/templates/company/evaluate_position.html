<!-- src/main/resources/templates/company/evaluate_position.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <title>Evaluate Traineeship</title>
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
</head>
<body>
  <div class="container mt-5" sec:authorize="hasAuthority('COMPANY')">
    <h2 th:text="'Evaluate: ' + ${position.title}">Evaluate Position</h2>

    <p>
      <strong>Period:</strong>
      <span th:text="${#temporals.format(position.startDate,'dd/MM/yyyy')}"></span>
      –
      <span th:text="${#temporals.format(position.endDate,'dd/MM/yyyy')}"></span>
    </p>
    <hr/>

    <form th:action="@{/company/positions/{posId}/evaluate(posId=${position.id})}"
      method="post"
      th:object="${position}">
  <!-- CSRF token -->
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

  <div class="form-group">
    <label for="motivation">Motivation (1–5)</label>
    <select id="motivation"
            name="companyMotivationRating"
            class="form-control"
            required>
      <option th:each="i : ${#numbers.sequence(1,5)}"
              th:value="${i}"
              th:text="${i}">1</option>
    </select>
  </div>
  <div class="form-group">
    <label for="effectiveness">Effectiveness (1–5)</label>
    <select id="effectiveness"
            name="companyEffectivenessRating"
            class="form-control"
            required>
      <option th:each="i : ${#numbers.sequence(1,5)}"
              th:value="${i}"
              th:text="${i}">1</option>
    </select>
  </div>
  <div class="form-group">
    <label for="efficiency">Efficiency (1–5)</label>
    <select id="efficiency"
            name="companyEfficiencyRating"
            class="form-control"
            required>
      <option th:each="i : ${#numbers.sequence(1,5)}"
              th:value="${i}"
              th:text="${i}">1</option>
    </select>
  </div>

  <button type="submit" class="btn btn-success">Save Evaluation</button>
  <a th:href="@{/company/positions/assigned}" class="btn btn-secondary">
    ← Back to Assigned
  </a>
</form>
  </div>
</body>
</html>
