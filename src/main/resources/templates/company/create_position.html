<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <title>Announce New Traineeship Position</title>
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
</head>
<body>

<div class="container mt-5" sec:authorize="hasAuthority('COMPANY')">
  <h2>Announce a New Position</h2>
  <form th:action="@{/company/positions/create}"
        th:object="${position}"
        method="post">

    <div class="form-group">
      <label for="title">Title</label>
      <input type="text"
             th:field="*{title}"
             class="form-control"
             id="title"
             placeholder="e.g. Java Backend Intern"
             required>
    </div>

    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="startDate">Start Date</label>
        <input type="date"
               th:field="*{startDate}"
               class="form-control"
               id="startDate"
               required>
      </div>
      <div class="form-group col-md-6">
        <label for="endDate">End Date</label>
        <input type="date"
               th:field="*{endDate}"
               class="form-control"
               id="endDate"
               required>
      </div>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea th:field="*{description}"
                class="form-control"
                id="description"
                rows="4"
                placeholder="Short description of the work…"
                required></textarea>
    </div>

    <div class="form-group">
      <label for="requiredSkills">Required Skills</label>
      <input type="text"
             th:field="*{requiredSkills}"
             class="form-control"
             id="requiredSkills"
             placeholder="Comma-separated, e.g. Java, SQL, Spring"
             required>
    </div>

    <div class="form-group">
      <label for="topics">Topics of Interest</label>
      <input type="text"
             th:field="*{topics}"
             class="form-control"
             id="topics"
             placeholder="e.g. Web Development, Microservices"
             required>
    </div>

    <button type="submit" class="btn btn-success">Announce Position</button>
    <a th:href="@{/company/positions}" class="btn btn-secondary">Cancel</a>
  </form>
</div>

</body>
</html>
