<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <title>My Supervised Positions</title>
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-5" sec:authorize="hasAuthority('PROFESSOR')">

  <h2>My Supervised Traineeships</h2>

  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

  <table class="table table-striped table-hover mt-4">
    <thead class="thead-light">
    <tr>
      <th>Title</th>
      <th>Company</th>
      <th>Student</th>
      <th>Period</th>
      <th>Description</th>
      <th style="width: 115px;">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="pos : ${positions}">
      <td th:text="${pos.title}">Title</td>
      <td th:text="${pos.company.name}">Company</td>
      <td th:text="${pos.assignedStudent.username}">student</td>
      <td>
        <span th:text="${pos.startDate}">–</span> – 
        <span th:text="${pos.endDate}">–</span>
      </td>
      <td th:text="${#strings.abbreviate(pos.description, 60)}">desc</td>
      <td>
        <a th:if="${pos.motivationRating == null}"
           th:href="@{|/professor/positions/${pos.id}/evaluate|}"
           class="btn btn-sm btn-primary">
          Evaluate
        </a>

        <span th:if="${pos.motivationRating != null}" class="text-success">
          Completed
        </span>
      </td>
    </tr>

    <tr th:if="${#lists.isEmpty(positions)}">
      <td colspan="6" class="text-center"><em>No positions found.</em></td>
    </tr>
    </tbody>
  </table>

  <a th:href="@{/professor/dashboard}" class="btn btn-secondary">← Back</a>
</div>
</body>
</html>
