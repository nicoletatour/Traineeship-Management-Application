<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <title>Positions Awaiting Supervisor</title>
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
</head>
<body>
  <div class="container mt-5" sec:authorize="hasAuthority('COMMITTEE')">
    <h2>Positions Awaiting Supervisor</h2>
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

    <table class="table table-striped table-hover mt-3">
      <thead class="thead-light">
        <tr>
          <th>Title</th>
          <th>Student</th>
          <th>Dates</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="pos : ${positions}">
          <td th:text="${pos.title}">Position Title</td>
          <td th:text="${pos.assignedStudent.username}">Student Name</td>
          <td>
            <span th:text="${pos.startDate}">Start</span> –
            <span th:text="${pos.endDate}">End</span>
          </td>
          <td>
            <a th:href="@{/committee/assignments/assign-professor/{id}(id=${pos.id})}"
               class="btn btn-sm btn-primary">
              Assign Supervisor
            </a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(positions)}">
          <td colspan="4" class="text-center"><em>No positions need supervisors.</em></td>
        </tr>
      </tbody>
    </table>
    <a th:href="@{/committee/dashboard}" class="btn btn-outline-secondary mt-3">
      ← Back to Dashboard
    </a>
  </div>
</body>
</html>
